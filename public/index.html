
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFind | Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CampusFind</h1>
        <p>Lost something? Let's find it.</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Lost & Found Portal</h2>
            <p>Help reunite lost items with their owners on campus.</p>
            <button onclick="showMessage()">Report an Item</button>
        </section>

        <section class="items">
            <h2>Recent Items</h2>
            <div class="item-list">
                <p>Your campus items will appear here.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>CampusFind &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
